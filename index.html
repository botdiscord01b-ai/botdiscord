<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasaruShop - Yulgang Online Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="bg-gray-800 border-b border-gray-700 py-4 px-6 flex justify-between items-center shadow-lg sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <span class="text-2xl font-black text-amber-400 tracking-wider">⚔️ MasaruShop</span>
            <span class="bg-amber-500/20 text-amber-400 text-xs font-semibold px-2.5 py-0.5 rounded border border-amber-500/30">Yulgang Store</span>
        </div>

        <!-- ส่วนแสดงข้อมูลผู้ใช้ / ปุ่ม Login และปุ่มแอดมิน -->
        <div class="flex items-center space-x-3">
            <!-- ปุ่มเปิดหน้าแอดมิน (ซ่อนไว้ก่อน จะแสดงเฉพาะ Owner ID เท่านั้น) -->
            <div id="admin-menu-btn-container"></div>
            
            <div id="auth-container">
                <a href="/api/login" id="login-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg font-medium transition duration-200 flex items-center space-x-2 shadow-md">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
                    <span>Login with Discord</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 flex-grow">
        <!-- Banner Header -->
        <div class="bg-gradient-to-r from-amber-900/40 via-gray-800 to-indigo-900/40 border border-amber-500/30 rounded-2xl p-6 md:p-10 mb-10 text-center shadow-xl">
            <h1 class="text-3xl md:text-5xl font-extrabold text-amber-300 mb-3 drop-shadow">ศูนย์รวมไอเทมและ M เกม Yulgang</h1>
            <p class="text-gray-300 text-base md:text-lg max-w-2xl mx-auto">ซื้อขายไอเทม ยาคลั่ง หญ้าเทพ และเงิน M ปลอดภัย 100% ยืนยันตัวตนด้วยบัญชี Discord</p>
        </div>

        <!-- ส่วนหัวข้อสินค้า + ปุ่มสร้างแพ็กเกจ (ถ้าเป็น Owner จะโชว์ปุ่มเพิ่ม) -->
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-amber-400">🛒 รายการสินค้าทั้งหมด</h2>
            <div id="admin-action-btn"></div>
        </div>

        <!-- รายการสินค้า Yulgang (เรนเดอร์ผ่าน JavaScript รองรับการเพิ่ม/ลบแพ็กเกจ) -->
        <div id="product-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- สินค้าจะถูกเติมเข้ามาที่นี่อัตโนมัติ -->
        </div>
    </main>

    <!-- Modal สำหรับสร้างแพ็กเกจใหม่ (ซ่อนไว้ก่อน) -->
    <div id="create-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-gray-800 border border-gray-700 rounded-2xl max-w-md w-full p-6 shadow-2xl">
            <h3 class="text-xl font-bold text-amber-300 mb-4">➕ สร้างแพ็กเกจสินค้าใหม่</h3>
            <form id="create-product-form" onsubmit="handleCreateProduct(event)">
                <div class="mb-4">
                    <label class="block text-gray-300 text-sm mb-1">ชื่อแพ็กเกจ / สินค้า</label>
                    <input type="text" id="p-name" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500" placeholder="เช่น เงิน M 500M">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-300 text-sm mb-1">รายละเอียดสินค้า</label>
                    <textarea id="p-desc" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500" placeholder="อธิบายรายละเอียดสินค้า..."></textarea>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-300 text-sm mb-1">ราคา (บาท)</label>
                    <input type="number" id="p-price" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500" placeholder="เช่น 250">
                </div>
                <div class="mb-6">
                    <label class="block text-gray-300 text-sm mb-1">ประเภทไอคอน / หมวดหมู่</label>
                    <select id="p-icon" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500">
                        <option value="💰">💰 เงิน M (Gold)</option>
                        <option value="🧪">🧪 ยาคลั่ง / บัฟ</option>
                        <option value="🥋">🥋 ชุดคลุม / แรร์ไอเทม</option>
                        <option value="⚔️">⚔️ อาวุธ / เครื่องประดับ</option>
                    </select>
                </div>
                <div class="flex justify-end space-x-3">
                    <button type="button" onclick="closeModal()" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg text-sm transition">ยกเลิก</button>
                    <button type="submit" class="bg-amber-500 hover:bg-amber-400 text-gray-950 font-bold px-4 py-2 rounded-lg text-sm transition">บันทึกสินค้า</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-800 border-t border-gray-700 py-6 text-center text-gray-400 text-sm mt-12">
        &copy; 2026 MasaruShop - Yulgang Marketplace. All rights reserved.
    </footer>

    <!-- Script จัดการระบบทั้งหมด -->
    <script>
        const OWNER_DISCORD_ID = "550122613087666177";

        // รายการสินค้าเริ่มต้น (ถ้ายังไม่มีใน localStorage)
        const defaultProducts = [
            { id: 1, name: "เงิน M โยกัง (100 M)", desc: "เงิน M สด พร้อมส่งมอบในเกม สะดวกรวดเร็ว ปลอดภัย", price: 50, icon: "💰" },
            { id: 2, name: "ชุดยาคลั่งตระกูลเทพ (100 เม็ด)", desc: "เพิ่มพลังโจมตีและป้องกัน ปลุกพลังตัวละครเวลไวเวลตึง", price: 120, icon: "🧪" },
            { id: 3, name: "ชุดคลุมจอมยุทธ์แรร์", desc: "ชุดคลุมหล่อๆ เท่ๆ สเตตัสเสริมออฟชั่นพิเศษสุดแรร์", price: 350, icon: "🥋" }
        ];

        // โหลดข้อมูลสินค้าจาก localStorage หรือใช้ค่าเริ่มต้น
        function getProducts() {
            const saved = localStorage.getItem('yulgang_products');
            return saved ? JSON.parse(saved) : defaultProducts;
        }

        function saveProducts(products) {
            localStorage.setItem('yulgang_products', JSON.stringify(products));
        }

        // 1. ตรวจสอบข้อมูล User จาก URL หลัง OAuth Callback
        const urlParams = new URLSearchParams(window.location.search);
        const userParam = urlParams.get('user');

        if (userParam) {
            try {
                const userData = JSON.parse(userParam);
                localStorage.setItem('discord_user', JSON.stringify(userData));
                window.history.replaceState({}, document.title, window.location.pathname);
            } catch (e) {
                console.error("Failed to parse user data", e);
            }
        }

        // 2. ตรวจสอบสถานะการล็อกอินและสิทธิ์ Owner
        const savedUser = localStorage.getItem('discord_user');
        const authContainer = document.getElementById('auth-container');
        const adminActionBtn = document.getElementById('admin-action-btn');
        let isOwner = false;

        if (savedUser) {
            const user = JSON.parse(savedUser);
            const avatarUrl = user.avatar 
                ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png` 
                : 'https://cdn.discordapp.com/embed/avatars/0.png';

            // เช็กว่าเป็น Owner หรือไม่
            if (user.id === OWNER_DISCORD_ID) {
                isOwner = true;
            }

            // แสดงโปรไฟล์ผู้ใช้ + ปุ่มออกจากระบบ
            authContainer.innerHTML = `
                <div class="flex items-center space-x-3">
                    <div class="flex items-center space-x-2 bg-gray-700/80 px-3 py-1.5 rounded-full border border-gray-600 shadow">
                        <img src="${avatarUrl}" alt="Avatar" class="w-7 h-7 rounded-full">
                        <span class="font-semibold text-sm text-amber-200">${user.username}</span>
                        ${isOwner ? '<span class="bg-red-500 text-white text-[10px] px-1.5 py-0.5 rounded font-bold"> OWNER </span>' : ''}
                    </div>
                    <button onclick="logout()" class="bg-red-600/80 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition duration-200">
                        ออกจากระบบ
                    </button>
                </div>
            `;
        }

        // ถ้าเป็น Owner ให้แสดงปุ่มสร้างแพ็กเกจสินค้าที่หน้าเว็บ
        if (isOwner) {
            adminActionBtn.innerHTML = `
                <button onclick="openModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded-lg text-sm transition flex items-center space-x-2 shadow-lg">
                    <span>➕ สร้างแพ็กเกจสินค้า</span>
                </button>
            `;
        }

        // 3. เรนเดอร์รายการสินค้าลงหน้าเว็บ
        function renderProducts() {
            const products = getProducts();
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';

            products.forEach(p => {
                let deleteBtnHtml = '';
                if (isOwner) {
                    deleteBtnHtml = `
                        <button onclick="deleteProduct(${p.id})" class="bg-red-600 hover:bg-red-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition shadow">
                            🗑️ ลบแพ็กเกจ
                        </button>
                    `;
                }

                grid.innerHTML += `
                    <div class="bg-gray-800 border border-gray-700 hover:border-amber-500/50 rounded-xl p-5 flex flex-col justify-between transition duration-300 shadow-lg relative">
                        <div>
                            <div class="bg-gradient-to-br from-amber-600/80 to-gray-900 h-44 rounded-lg mb-4 flex flex-col items-center justify-center text-amber-100 shadow-inner">
                                <span class="text-5xl mb-1">${p.icon}</span>
                                <span class="font-black text-lg text-amber-300 mt-1">${p.name}</span>
                            </div>
                            <h3 class="text-xl font-bold text-amber-300">${p.name}</h3>
                            <p class="text-gray-400 text-sm mt-2">${p.desc}</p>
                        </div>
                        <div class="mt-6 border-t border-gray-700/50 pt-4 flex items-center justify-between">
                            <span class="text-emerald-400 font-extrabold text-xl">${p.price} บาท</span>
                            <div class="flex items-center space-x-2">
                                ${deleteBtnHtml}
                                <button onclick="buyItem('${p.name}')" class="bg-amber-500 hover:bg-amber-400 text-gray-950 font-bold px-4 py-2 rounded-lg text-sm transition shadow-md">สั่งซื้อ</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // 4. ฟังก์ชันจัดการ Modal สร้างสินค้า
        function openModal() {
            document.getElementById('create-modal').classList.remove('hidden');
            document.getElementById('create-modal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('create-modal').classList.remove('flex');
            document.getElementById('create-modal').classList.add('hidden');
        }

        // 5. ฟังก์ชันบันทึกสินค้าใหม่ (สร้างแพ็กเกจ)
        function handleCreateProduct(event) {
            event.preventDefault();
            const name = document.getElementById('p-name').value;
            const desc = document.getElementById('p-desc').value;
            const price = Number(document.getElementById('p-price').value);
            const icon = document.getElementById('p-icon').value;

            const products = getProducts();
            const newProduct = {
                id: Date.now(), // ใช้ Timestamp เป็น ID ป้องกันซ้ำ
                name,
                desc,
                price,
                icon
            };

            products.push(newProduct);
            saveProducts(products);
            closeModal();
            document.getElementById('create-product-form').reset();
            renderProducts();
            alert('🎉 สร้างแพ็กเกจสินค้าใหม่สำเร็จ!');
        }

        // 6. ฟังก์ชันลบแพ็กเกจสินค้า
        function deleteProduct(id) {
            if (confirm('⚠️ คุณแน่ใจหรือไม่ที่จะลบแพ็กเกจสินค้านี้?')) {
                let products = getProducts();
                products = products.filter(p => p.id !== id);
                saveProducts(products);
                renderProducts();
                alert('🗑️ ลบแพ็กเกจสินค้าเรียบร้อยแล้ว');
            }
        }

        // 7. ฟังก์ชันกดซื้อสินค้า
        function buyItem(itemName) {
            const user = localStorage.getItem('discord_user');
            if (!user) {
                alert('⚠️ กรุณาล็อกอินด้วยบัญชี Discord ก่อนทำการสั่งซื้อครับ');
                window.location.href = '/api/login';
            } else {
                const userData = JSON.parse(user);
                alert(`🎉 คุณ [${userData.username}] ได้ทำรายการสั่งซื้อ: ${itemName}\n(ระบบกำลังพาไปยังขั้นตอนชำระเงิน...)`);
            }
        }

        // 8. ฟังก์ชันออกจากระบบ
        function logout() {
            localStorage.removeItem('discord_user');
            window.location.reload();
        }

        // รันฟังก์ชันแสดงผลสินค้าตอนโหลดหน้าเว็บ
        renderProducts();
    </script>
</body>
</html>
