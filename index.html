<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasaruShop</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            margin-bottom: 20px;
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>MasaruShop Marketplace</h1>
        <p>ยินดีต้อนรับสู่ร้านค้าออนไลน์ กรุณาเข้าสู่ระบบด้วยบัญชี Discord ของคุณ</p>

        <!-- ปุ่มสำหรับกด ล็อกอินด้วย Discord -->
        <a href="/api/login" id="login-btn" style="background-color: #5865F2; color: white; padding: 10px 20px; border-radius: 5px; text-decoration: none; font-weight: bold; display: inline-block; margin-top: 15px;">
          Login with Discord
        </a>

        <!-- ส่วนแสดงผลเมื่อล็อกอินสำเร็จ -->
        <div id="user-profile" style="display: none; align-items: center; justify-content: center; gap: 12px; margin-top: 20px; background: #334155; padding: 10px; border-radius: 8px;">
          <img id="user-avatar" src="" style="width: 45px; height: 45px; border-radius: 50%; object-fit: cover;" />
          <span id="user-name" style="font-weight: bold; color: #f1f5f9;"></span>
        </div>
    </div>

    <script>
      // ดึงข้อมูลผู้ใช้จาก URL Parameter หลังจาก Redirect กลับมา
      const urlParams = new URLSearchParams(window.location.search);
      const userParam = urlParams.get('user');

      if (userParam) {
        try {
          const user = JSON.parse(decodeURIComponent(userParam));

          // ซ่อนปุ่ม Login แล้วแสดงรูปกับชื่อผู้ใช้แทน
          document.getElementById('login-btn').style.display = 'none';
          document.getElementById('user-profile').style.display = 'flex';
          document.getElementById('user-name').innerText = user.username;
          
          // สร้างลิงก์รูปโปรไฟล์ Discord
          const avatarUrl = user.avatar 
            ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`
            : 'https://cdn.discordapp.com/embed/avatars/0.png';
          document.getElementById('user-avatar').src = avatarUrl;
        } catch (e) {
          console.error("Failed to parse user data", e);
        }
      }
    </script>

</body>
</html>
